# Requires a 32-core A5 image with the two V4.1 operator wheels and the
# cannbotdsl AICPU header-path workaround documented in the model guide.
test_name: "DeepSeek-V4.1-Flash-A5-MRV2-PD"
model: "deepseek-ai/DeepSeek-V4.1-Flash"
num_nodes: 2
npu_per_node: 8
dp_load_balancing: internal

env_common: &env_common
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_RPC_TIMEOUT: "3600000"
  HCCL_EXEC_TIMEOUT: "1200"
  HCCL_CONNECT_TIMEOUT: "1200"
  HCCL_BUFFSIZE: "2300"
  HCCL_DETERMINISTIC: "true"
  HCCL_OP_EXPANSION_MODE: "CCU_SCHED"
  ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  SERVER_PORT: "8080"

disaggregated_prefill:
  enabled: true
  prefiller_host_index: [0]
  decoder_host_index: [1]

deployment:
  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve deepseek-ai/DeepSeek-V4.1-Flash
      --host 0.0.0.0 --port $SERVER_PORT --api-server-count 1
      --data-parallel-size 8 --tensor-parallel-size 1
      --enable-expert-parallel --enable-ep-weight-filter
      --seed 1024 --max-model-len 262144
      --max-num-batched-tokens 4096 --max-num-seqs 64
      --block-size 128 --enable-prefix-caching
      --limit-mm-per-prompt '{"image":0}'
      --model-loader-extra-config '{"enable_multithread_load":true,"num_threads":128}'
      --safetensors-load-strategy lazy --trust-remote-code
      --engram-config '{"cpu_offload":true,"dp_shared_memory":true}'
      --tokenizer-mode deepseek_v41 --reasoning-parser deepseek_v41
      --tool-call-parser deepseek_v41 --enable-auto-tool-choice
      --gpu-memory-utilization 0.90 --quantization deepseek_v4_fp8
      --async-scheduling --enforce-eager
      --speculative-config '{"method":"dspark","num_speculative_tokens":5,"enforce_eager":true}'
      --kv-transfer-config '{"kv_connector":"MooncakeHybridConnector","kv_role":"kv_producer","kv_port":30000,"engine_id":"0","kv_connector_extra_config":{"prefill":{"dp_size":8,"tp_size":1},"decode":{"dp_size":8,"tp_size":1}}}'
      --additional-config '{"multistream_engram_overlap":false,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"multistream_dsv4_dsa_overlap":true,"enable_fused_mc2":0,"enable_force_eplb":false}'
  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve deepseek-ai/DeepSeek-V4.1-Flash
      --host 0.0.0.0 --port $SERVER_PORT --api-server-count 1
      --data-parallel-size 8 --tensor-parallel-size 1
      --enable-expert-parallel --enable-ep-weight-filter
      --seed 1024 --max-model-len 262144
      --max-num-batched-tokens 1024 --max-num-seqs 64
      --block-size 128 --enable-prefix-caching
      --limit-mm-per-prompt '{"image":0}'
      --model-loader-extra-config '{"enable_multithread_load":true,"num_threads":128}'
      --safetensors-load-strategy lazy --trust-remote-code
      --engram-config '{"cpu_offload":true,"dp_shared_memory":true}'
      --tokenizer-mode deepseek_v41 --reasoning-parser deepseek_v41
      --tool-call-parser deepseek_v41 --enable-auto-tool-choice
      --gpu-memory-utilization 0.90 --quantization deepseek_v4_fp8
      --async-scheduling
      --speculative-config '{"method":"dspark","num_speculative_tokens":5,"enforce_eager":false}'
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      --kv-transfer-config '{"kv_connector":"MooncakeHybridConnector","kv_role":"kv_consumer","kv_port":30100,"engine_id":"1","kv_connector_extra_config":{"prefill":{"dp_size":8,"tp_size":1},"decode":{"dp_size":8,"tp_size":1}}}'
      --additional-config '{"multistream_engram_overlap":true,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"multistream_dsv4_dsa_overlap":true,"enable_fused_mc2":0,"enable_force_eplb":false,"scheduler_config":{"recompute_scheduler_enable":true}}'

benchmarks:
  acc-gpqa:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 128000
    batch_size: 200
    # Observed 178/198 on the 4cbe4962c + freshly built extension validation.
    # Use the same five-point tolerance as the existing V4.1 A3 GPQA case.
    baseline: 89.90
    threshold: 5
    temperature: 1
    top_p: 1
    thinking: true